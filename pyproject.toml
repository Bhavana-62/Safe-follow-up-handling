[project]
name = "readonly-agent"
version = "0.1.0"
description = "Read-Only Enterprise Agent with Session Follow-Up Rewriting & Entitlement Scoping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.3,<1",
    "pyjwt[crypto]>=2.9,<3",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "pypdf>=5.0,<6",
    "python-docx>=1.1,<2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
