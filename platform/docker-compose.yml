name: readonly-agent
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me}
    ports: ["${PG_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-change-me}
      KC_HEALTH_ENABLED: "true"
    ports: ["${KC_PORT:-8080}:8080"]
    volumes:
      - ./keycloak/realm-agent.json:/opt/keycloak/data/import/realm.json:ro

  ollama:
    image: ollama/ollama:latest
    ports: ["${OLLAMA_PORT:-11434}:11434"]
    volumes:
      - ollama:/root/.ollama

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ["${FRONTEND_PORT:-3000}:80"]
    depends_on:
      - postgres

volumes:
  pgdata:
  ollama:
